[package]
name = "dataabeg"
version = "1.0.0"
description = "DataAbeg Mobile VTU Dispenser"
authors = ["Bimex Group"]
edition = "2021"
build = "build.rs"

[lib]
name = "dataabeg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mobile)'] }
