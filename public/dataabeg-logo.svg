<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Subtle Shadow -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#primaryGrad)" />
  <rect x="6" y="6" width="108" height="108" rx="28" stroke="url(#accentGlow)" stroke-width="2" />

  <!-- Radiating Data Connectivity Waves -->
  <path d="M72 32 C84 38, 92 50, 92 64 C92 78, 84 90, 72 96" stroke="#60A5FA" stroke-width="4.5" stroke-linecap="round" opacity="0.4" />
  <path d="M64 42 C72 47, 78 55, 78 64 C78 73, 72 81, 64 86" stroke="#93C5FD" stroke-width="4" stroke-linecap="round" opacity="0.75" />

  <!-- High-Energy Fast-Dispense Lightning Bolt -->
  <path d="M62 20 L36 62 L54 62 L48 100 L76 54 L58 54 Z" fill="url(#boltGrad)" filter="url(#glow)" />

  <!-- Cellular Node Pulse Dots -->
  <circle cx="82" cy="30" r="3" fill="#38BDF8" />
  <circle cx="94" cy="46" r="3.5" fill="#60A5FA" />
  <circle cx="96" cy="64" r="4" fill="#93C5FD" />
</svg>
