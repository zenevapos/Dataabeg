<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="60%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Outer Rim Glow -->
    <linearGradient id="rimGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.3" />
    </linearGradient>

    <!-- Primary Electric Bolt Gradient -->
    <linearGradient id="mainBolt" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#93C5FD" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Golden Speed Accent Facet -->
    <linearGradient id="goldFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="logoShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Shadow -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#shieldGrad)" filter="url(#logoShadow)" />
  <rect x="6" y="6" width="88" height="88" rx="24" stroke="url(#rimGlow)" stroke-width="1.8" fill="none" />

  <!-- Radiating 5G / High-Speed Telecom Data Waves -->
  <path d="M64 26 C75 32, 82 43, 82 55 C82 67, 75 78, 64 84" 
        stroke="#60A5FA" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.45" />
  <path d="M57 34 C64 39, 69 47, 69 55 C69 63, 64 71, 57 76" 
        stroke="#93C5FD" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />

  <!-- Speed Data Nodes -->
  <circle cx="73" cy="24" r="2.5" fill="#38BDF8" />
  <circle cx="83" cy="40" r="2.8" fill="#60A5FA" />
  <circle cx="84" cy="55" r="3" fill="#93C5FD" />

  <!-- Dual-Tone High-Speed Lightning Bolt (Energy & VTU Dispense) -->
  <!-- Back / Gold Energy Core -->
  <path d="M52 16 L27 52 L43 52 L36 84 L67 46 L49 46 Z" fill="url(#goldFacet)" opacity="0.95" />
  <!-- Front Bright Electric Facet -->
  <path d="M52 16 L31 52 L43 52 L38 84 L65 48 L49 48 Z" fill="url(#mainBolt)" />
  <!-- Crisp Center Light Edge -->
  <path d="M50 20 L35 50 L46 50 L40 76" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9" />
</svg>
