<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Definitions for 3D Glossy Sphere -->
  <defs>
    <!-- Base 3D Sphere Radial Gradient -->
    <radialGradient id="gloSphere" cx="40%" cy="35%" r="60%" fx="35%" fy="30%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="35%" stop-color="#16A34A"/>
      <stop offset="75%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#052E16"/>
    </radialGradient>
    <!-- Specular Highlight Curve -->
    <linearGradient id="gloHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Clean Base Container -->
  <rect width="100" height="100" rx="22" fill="#F0FDF4"/>

  <!-- 3D Globe Circle -->
  <circle cx="50" cy="50" r="42" fill="url(#gloSphere)"/>
  
  <!-- Glossy Specular Top Crescent -->
  <path d="M20 38 C24 20, 76 20, 80 38 C68 32, 32 32, 20 38 Z" fill="url(#gloHighlight)"/>

  <!-- Iconic Lowercase glo Text -->
  <text x="50" y="60" font-family="'Plus Jakarta Sans', 'Arial Rounded MT Bold', 'Helvetica Neue', sans-serif" font-size="30" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1.5">glo</text>
</svg>
